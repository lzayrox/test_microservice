name: CI/CD orders-service

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 1. Pruebas unitarias
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test

  docker:
    name: 2-3. Construir y publicar imagen
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Definir nombre inmutable de imagen
        id: image
        run: |
          REPOSITORY="${REGISTRY}/${IMAGE_NAME,,}"
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "value=${REPOSITORY}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Construir imagen (validación de pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Construir y publicar imagen (rama main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.value }}
            ${{ steps.image.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 4. Validar despliegue con Docker Compose
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Levantar la imagen publicada
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          docker compose pull
          docker compose up -d --no-build --wait --wait-timeout 120
      - name: Probar el servicio desplegado
        run: curl --fail --show-error --silent http://localhost:8080/health
      - name: Mostrar logs si falla el despliegue
        if: failure()
        run: docker compose logs
      - name: Detener el entorno de validación
        if: always()
        run: docker compose down --volumes
