name: CI/CD orders-service

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: 1. Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas
        run: npm test

  docker:
    name: 2-3. Construir y publicar imagen
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Definir nombre inmutable de imagen
        id: image
        run: |
          REPOSITORY="${REGISTRY}/${IMAGE_NAME,,}"
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "value=${REPOSITORY}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Construir imagen (validación de pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Construir y publicar imagen (rama main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.value }}
            ${{ steps.image.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 4. Desplegar con Docker Compose
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar acceso SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Copiar configuración de Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'mkdir -p ~/orders-service'
          scp compose.yaml "${DEPLOY_USER}@${DEPLOY_HOST}:~/orders-service/compose.yaml"
      - name: Autenticar el servidor en GHCR
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login ghcr.io --username '${GHCR_USERNAME}' --password-stdin"
      - name: Actualizar el servicio
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ~/orders-service && IMAGE='${DEPLOY_IMAGE}' docker compose pull && IMAGE='${DEPLOY_IMAGE}' docker compose up -d --remove-orphans --wait --wait-timeout 120"
